name: Verify Relay
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: relay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_MODE: demo
      DATABASE_URL: postgresql://relay:ci-only-password@localhost:5432/relay_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      APP_ORIGIN: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
